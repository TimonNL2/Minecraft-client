name: Build and publish client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }} (${{ matrix.renderer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.2', '26.3']
        renderer: ['vanilla', 'sodium']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install graphics test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0 libopenal1 libxkbcommon0
      - name: Build and run survival client tests
        env:
          MC_VERSION: ${{ matrix.minecraft }}
          TEST_RENDERER: ${{ matrix.renderer }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          # SDL3 in Minecraft 26.3 needs EGL on the headless Mesa runner.
          SDL_VIDEO_FORCE_EGL: '1'
          ALSOFT_DRIVERS: 'null'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo 'Tag must match mod_version in gradle.properties'; exit 1; }
          else
            version="$version-dev.$GITHUB_RUN_NUMBER"
          fi
          chmod +x gradlew
          xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon --console=plain \
            "-Pminecraft_version=$MC_VERSION" "-Pmod_version=$version" "-Ptest_renderer=$TEST_RENDERER" \
            "-Pbuild_number=$GITHUB_RUN_NUMBER" "-Pcommit=$GITHUB_SHA" \
            runClientGameTest collectRelease
      - name: Save jars and matching sources
        if: matrix.renderer == 'vanilla'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-mc${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 90
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-mc${{ matrix.minecraft }}-${{ matrix.renderer }}
          path: |
            build/run/clientGameTest/screenshots/**
            build/run/clientGameTest/logs/latest.log
            build/run/clientGameTest/crash-reports/**
            build/${{ matrix.minecraft }}/reports/**
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish both versions
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout matching source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download successful builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-mc*
          merge-multiple: true
          path: release-assets
      - name: Package source and installation guide
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=vesper-client/ -o release-assets/vesper-client-complete-source.zip HEAD
          cp docs/INSTALLATION.md release-assets/INSTALLATION.md
          cp LICENSE release-assets/LICENSE.txt
          cp NOTICE.md release-assets/NOTICE.md
          (cd release-assets && sha256sum *.jar *.zip > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            title="Vesper Client $tag — Minecraft 26.2 and 26.3"
            release_flags=(--latest)
          else
            tag="build-$GITHUB_RUN_NUMBER"
            title="Development build $GITHUB_RUN_NUMBER — Minecraft 26.2 and 26.3"
            release_flags=(--prerelease --latest=false)
          fi
          {
            printf 'Two separate Fabric client mods: choose the jar matching your Minecraft version.\n\n'
            printf 'Requires Java 25, Fabric Loader 0.19.5+ and Fabric API 0.161.0 for the same Minecraft version.\n\n'
            printf '**Installation:** download the normal jar; files ending in `-sources` contain source code. Remove Meteor and older Timon/Vesper jars from that profile. Right Shift opens the menu; F8 disables every module.\n\n'
            printf 'Both versions passed automated survival client tests with the vanilla renderer and Sodium. Server checks and anticheat may still reject client actions.\n\n'
            printf 'Source commit: `%s`. [Changelog](https://github.com/%s/blob/%s/CHANGELOG.md) · [Installation guide](https://github.com/%s/blob/%s/docs/INSTALLATION.md).\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md "${release_flags[@]}"
          fi
