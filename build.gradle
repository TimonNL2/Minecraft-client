plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }
layout.buildDirectory = file("build/${project.minecraft_version}")
if (!(project.minecraft_version in ['26.2', '26.3'])) throw new GradleException('Supported Minecraft versions: 26.2 and 26.3')
def sodiumVersion = project.minecraft_version == '26.3' ? 'mc26.3-0.9.3-alpha.1-fabric' : 'mc26.2-0.9.1-fabric'
def testRenderer = providers.gradleProperty('test_renderer').getOrElse('vanilla')
if (!(testRenderer in ['vanilla', 'sodium'])) throw new GradleException('Supported test renderers: vanilla and sodium')

repositories {
    mavenCentral()
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
    maven { url = 'https://repo.viaversion.com' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

configurations { bundled }
configurations.implementation.extendsFrom(configurations.bundled)
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+${project.minecraft_version}"
    compileOnly("maven.modrinth:sodium:$sodiumVersion") { transitive = false }
    compileOnly('maven.modrinth:lithium:mc26.2-0.25.2-fabric') { transitive = false }
    compileOnly('maven.modrinth:iris:1.11.2+26.2-fabric') { transitive = false }
    compileOnly('maven.modrinth:modmenu:20.0.1') { transitive = false }
    compileOnly('com.viaversion:viafabricplus:4.6.1') { transitive = false }
    compileOnly('com.viaversion:viafabricplus-api:4.6.1') { transitive = false }
    compileOnly 'meteordevelopment:baritone:26.1-20260423.173134-2'
    bundled 'meteordevelopment:orbit:0.2.4'
    bundled 'org.meteordev:starscript:0.2.5'
    bundled 'meteordevelopment:discord-ipc:1.1'
    bundled 'org.reflections:reflections:0.10.2'
    bundled('io.netty:netty-handler-proxy:4.2.15.Final') { transitive = false }
    bundled('io.netty:netty-codec-socks:4.2.15.Final') { transitive = false }
    bundled 'de.florianreuth:waybackauthlib:1.1.0'
    bundled('net.raphimc:MinecraftAuth:5.0.2') {
        exclude group: 'com.google.code.gson'
        exclude group: 'com.google.errorprone'
    }
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Include runtime libraries and their dependencies as individual Fabric nested jars.
configurations.include.defaultDependencies { deps ->
    configurations.bundled.incoming.resolutionResult.allComponents.each { component ->
        def id = component.id
        if (id instanceof ModuleComponentIdentifier && !(id.group in ['org.slf4j', 'com.google.code.findbugs'])) {
            deps.add(project.dependencies.create("${id.group}:${id.module}:${id.version}") { transitive = false })
        }
    }
}

// The common source is 26.2. Changed files in mc26.3 replace it, rather than
// copying two entire projects or downloading source during a build.
def overrides = file("src/mc${project.minecraft_version}")
def removed = new File(overrides, 'removed.txt')
def removedPaths = removed.exists() ? removed.readLines().toSet() : [] as Set
['java', 'resources'].each { kind ->
    def common = file("src/main/$kind").toPath()
    sourceSets.main[kind].setSrcDirs([common.toFile(), new File(overrides, kind)])
    sourceSets.main[kind].exclude { details ->
        if (!details.file.toPath().startsWith(common)) return false
        def relative = common.relativize(details.file.toPath()).toString().replace('\\', '/')
        return removedPaths.contains("$kind/$relative".toString()) || new File(overrides, "$kind/$relative").isFile()
    }
}

loom { accessWidenerPath = file("src/${project.minecraft_version == '26.3' ? 'mc26.3' : 'main'}/resources/meteor-client.classtweaker") }
processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version,
                 loader_version: project.loader_version, jdk_version: '25',
                 build_number: providers.gradleProperty('build_number').getOrElse('local'),
                 commit: providers.gradleProperty('commit').getOrElse('')]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand(props) }
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'timonclient-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
if (testRenderer == 'sodium') {
    dependencies {
        gametestRuntimeOnly("maven.modrinth:sodium:${providers.gradleProperty('test_sodium_version').getOrElse(sodiumVersion)}") { transitive = false }
    }
}
tasks.named('runClientGameTest') {
    systemProperty 'timon.test.renderer', testRenderer
}
jar {
    from('LICENSE', 'NOTICE.md')
    from('licenses') { into 'licenses' }
}
tasks.register('collectRelease', Copy) {
    dependsOn tasks.named('build')
    from(tasks.named('jar'), tasks.named('sourcesJar'))
    into layout.projectDirectory.dir('dist')
}
