plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }
layout.buildDirectory = file("build/${project.minecraft_version}")

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+${project.minecraft_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand(version: project.version, minecraft_version: project.minecraft_version)
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'timonclient-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }

tasks.register('collectRelease', Copy) {
    dependsOn tasks.named('build')
    from tasks.named('jar')
    into layout.projectDirectory.dir('dist')
}
